
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CodeCraftHub: Your Learning Management Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --primary: #8B5CF6;
      --success: #F59E0B;
      --danger: #EF4444;
      --bg: #f9fafb;
      --card-bg: #fff;
      --border: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --radius: 16px;
      --shadow: 0 4px 24px 0 rgba(139,92,246,0.08);
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(90deg, var(--primary) 60%, var(--success) 100%);
      color: #fff;
      padding: 2rem 1rem 1.5rem 1rem;
      text-align: center;
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
    }
    header::after {
      content: "";
      position: absolute;
      top: -40px; right: -60px;
      width: 180px; height: 180px;
      background: rgba(245,158,11,0.12);
      border-radius: 50%;
      z-index: 0;
      filter: blur(2px);
    }
    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin: 0;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1rem 2rem 1rem;
    }
    .message {
      margin-bottom: 1.5rem;
      padding: 1rem 1.5rem;
      border-radius: var(--radius);
      font-weight: 500;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 2px 8px 0 rgba(139,92,246,0.04);
      border: 1px solid var(--border);
      animation: fadeIn 0.3s;
    }
    .message.success, .btn-success { background: #fef3c7; color: var(--success); border-color: var(--success);}
    .message.error { background: #fee2e2; color: var(--danger); border-color: var(--danger);}
    .message .close {
      margin-left: auto;
      background: none;
      border: none;
      color: inherit;
      font-size: 1.2em;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .message .close:hover { opacity: 1; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px);}
      to { opacity: 1; transform: translateY(0);}
    }
    form#add-course-form {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: flex-end;
    }
    form#add-course-form .form-group {
      flex: 1 1 220px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 160px;
    }
    form#add-course-form label {
      font-weight: 600;
      color: var(--muted);
      font-size: 0.98rem;
    }
    form#add-course-form input,
    form#add-course-form textarea,
    form#add-course-form select {
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 1rem;
      background: #f3f4f6;
      color: var(--text);
      transition: border 0.2s;
    }
    form#add-course-form input:focus,
    form#add-course-form textarea:focus,
    form#add-course-form select:focus {
      border-color: var(--primary);
      outline: none;
    }
    .btn-primary {
      background: #8B5CF6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.8rem 2.2rem;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 8px 0 rgba(139,92,246,0.08);
      transition: background 0.2s, transform 0.1s;
      margin-top: 1.2rem;
      align-self: flex-end;
    }
    .btn-primary:hover {
      background: #7c3aed;
      transform: translateY(-2px) scale(1.03);
    }
    .courses-table-container {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem 1rem;
      overflow-x: auto;
    }
    table.courses-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
      min-width: 700px;
    }
    table.courses-table th, table.courses-table td {
      padding: 0.9rem 0.7rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    table.courses-table th {
      color: var(--primary);
      font-weight: 700;
      background: #f3f4f6;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
    }
    table.courses-table tr:last-child td {
      border-bottom: none;
    }
    .course-actions {
      display: flex;
      gap: 0.5rem;
    }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1.1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
      outline: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      background: #8B5CF6;
    }
    .btn-edit {
      background: #8B5CF6;
      color: #fff;
    }
    .btn-edit:hover { background: #7c3aed; }
    .btn-danger {
      background: #EF4444;
      color: #fff;
    }
    .btn-danger:hover { background: #dc2626; }
    .btn-save {
      background: #F59E0B;
      color: #fff;
    }
    .btn-save:hover { background: #d97706; }
    .btn-cancel {
      background: #e5e7eb;
      color: var(--muted);
    }
    .btn-cancel:hover { background: #d1d5db; }
    .btn-success {
      background: #F59E0B;
      color: #fff;
      border: 1px solid #F59E0B;
    }
    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid #e5e7eb;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg);}
    }
    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 2.5rem 0;
      font-size: 1.1rem;
    }
    /* Modal styles */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(31,41,55,0.18);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s;
    }
    .modal {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 8px 32px 0 rgba(139,92,246,0.18);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      min-width: 320px;
      max-width: 98vw;
      width: 400px;
      position: relative;
      animation: fadeIn 0.2s;
    }
    .modal h2 {
      margin-top: 0;
      color: var(--primary);
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
    }
    .modal .close-modal {
      position: absolute;
      top: 1.1rem; right: 1.1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--muted);
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .modal .close-modal:hover { opacity: 1; }
    .modal form .form-group {
      margin-bottom: 1.1rem;
    }
    .modal-actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      margin-top: 1.2rem;
    }
    /* Responsive */
    @media (max-width: 700px) {
      form#add-course-form {
        flex-direction: column;
        gap: 1rem;
        padding: 1.2rem 0.7rem;
      }
      .courses-table-container {
        padding: 1rem 0.2rem;
      }
      table.courses-table {
        font-size: 0.97rem;
        min-width: 500px;
      }
      .modal {
        padding: 1.2rem 0.7rem;
        width: 98vw;
      }
    }
    @media (max-width: 500px) {
      header h1 { font-size: 1.3rem; }
      .modal { min-width: unset; width: 98vw;}
      table.courses-table { font-size: 0.93rem; }
    }
  </style>
</head>
<body>
<header>
  <h1>CodeCraftHub: Your Learning Management Platform</h1>
</header>
<div class="container">
  <div id="message-container"></div>
  <form id="add-course-form" autocomplete="off">
    <div class="form-group">
      <label for="course-name">Course Name *</label>
      <input type="text" id="course-name" name="name" required maxlength="80" placeholder="e.g. JavaScript Essentials">
    </div>
    <div class="form-group">
      <label for="course-description">Description *</label>
      <textarea id="course-description" name="description" required maxlength="300" rows="2" placeholder="Brief course description"></textarea>
    </div>
    <div class="form-group">
      <label for="course-date">Target Date *</label>
      <input type="date" id="course-date" name="target_date" required>
    </div>
    <div class="form-group">
      <label for="course-status">Status *</label>
      <select id="course-status" name="status" required>
        <option value="">Select status</option>
        <option value="NOT_STARTED">Not Started</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="COMPLETED">Completed</option>
      </select>
    </div>
    <button type="submit" id="add-course-btn" class="btn-primary">Add Course</button>
  </form>
  <div class="courses-table-container" id="courses-table-container">
    <div class="spinner" id="courses-loading" style="display:none;"></div>
    <table class="courses-table" id="courses-table" style="display:none;">
      <thead>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Target Date</th>
        <th>Status</th>
        <th>Created At</th>
        <th style="text-align:center;">Actions</th>
      </tr>
      </thead>
      <tbody id="courses-tbody"></tbody>
    </table>
    <div class="empty-state" id="courses-empty" style="display:none;">No courses found. Start by adding a new course above!</div>
  </div>
</div>
<!-- Modal for editing -->
<div id="modal-root"></div>
<script>
  // --- Status Mapping ---
  const statusEnumToLabel = {
    NOT_STARTED: "Not Started",
    IN_PROGRESS: "In Progress",
    COMPLETED: "Completed"
  };

  // --- Utility Functions ---
  function showMessage(type, text) {
    const msgContainer = document.getElementById('message-container');
    msgContainer.innerHTML = `
      <div class="message ${type} ${type === 'success' ? 'btn-success' : ''}">
        <span>${type === 'success' ? '✔️' : '❌'}</span>
        <span>${text}</span>
        <button class="close" aria-label="Close">&times;</button>
      </div>
    `;
    msgContainer.querySelector('.close').onclick = () => msgContainer.innerHTML = '';
    setTimeout(() => { msgContainer.innerHTML = ''; }, 5000);
  }
  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }
  function setLoading(isLoading) {
    document.getElementById('courses-loading').style.display = isLoading ? 'block' : 'none';
    document.getElementById('courses-table').style.display = isLoading ? 'none' : 'table';
    document.getElementById('courses-empty').style.display = 'none';
  }
  function setEmptyState(isEmpty) {
    document.getElementById('courses-empty').style.display = isEmpty ? 'block' : 'none';
    document.getElementById('courses-table').style.display = isEmpty ? 'none' : 'table';
  }
  // --- API Calls ---
  const API_BASE = 'http://localhost:8080/api/courses';
  async function apiGetCourses() {
    setLoading(true);
    try {
      const res = await fetch(API_BASE);
      if (!res.ok) throw new Error('Failed to fetch courses');
      const data = await res.json();
      setLoading(false);
      return data;
    } catch (err) {
      setLoading(false);
      showMessage('error', err.message || 'Error loading courses');
      return [];
    }
  }
  async function apiAddCourse(course) {
    try {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(course)
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || 'Failed to add course');
      }
      showMessage('success', 'Course added successfully!');
      return await res.json();
    } catch (err) {
      showMessage('error', err.message || 'Error adding course');
      throw err;
    }
  }
  async function apiUpdateCourse(id, updates) {
    try {
      const res = await fetch(`${API_BASE}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updates)
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || 'Failed to update course');
      }
      showMessage('success', 'Course updated successfully!');
      return await res.json();
    } catch (err) {
      showMessage('error', err.message || 'Error updating course');
      throw err;
    }
  }
  async function apiDeleteCourse(id) {
    try {
      const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || 'Failed to delete course');
      }
      showMessage('success', 'Course deleted successfully!');
      return true;
    } catch (err) {
      showMessage('error', err.message || 'Error deleting course');
      throw err;
    }
  }
  // --- Render Functions ---
  let courses = [];
  async function loadCourses() {
    courses = await apiGetCourses();
    renderCourses();
  }
  function renderCourses() {
    const tbody = document.getElementById('courses-tbody');
    tbody.innerHTML = '';
    if (!courses.length) {
      setEmptyState(true);
      return;
    }
    setEmptyState(false);
    for (const course of courses) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHTML(course.name)}</td>
        <td>${escapeHTML(course.description)}</td>
        <td>${escapeHTML(course.target_date)}</td>
        <td>${escapeHTML(statusEnumToLabel[course.status] || course.status)}</td>
        <td>${formatDate(course.created_at)}</td>
        <td>
          <div class="course-actions">
            <button class="btn btn-edit" data-id="${course.id}" aria-label="Edit ${escapeHTML(course.name)}">Edit</button>
            <button class="btn btn-danger" onclick="handleDelete('${course.id}')" aria-label="Delete ${escapeHTML(course.name)}">Remove</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    }
    // Attach event listeners for edit
    tbody.querySelectorAll('.btn-edit').forEach(btn => {
      btn.onclick = () => openEditModal(btn.dataset.id);
    });
    // Delete handled by inline onclick
  }
  // --- Add Course Form ---
  document.getElementById('add-course-form').onsubmit = async function(e) {
    e.preventDefault();
    const form = e.target;
    const name = form.name.value.trim();
    const description = form.description.value.trim();
    const target_date = form.target_date.value;
    const status = form.status.value;
    if (!name || !description || !target_date || !status) {
      showMessage('error', 'Please fill in all required fields.');
      return;
    }
    document.getElementById('add-course-btn').disabled = true;
    document.getElementById('add-course-btn').textContent = 'Adding...';
    try {
      const newCourse = { name, description, target_date, status };
      await apiAddCourse(newCourse);
      form.reset();
      await loadCourses();
    } finally {
      document.getElementById('add-course-btn').disabled = false;
      document.getElementById('add-course-btn').textContent = 'Add Course';
    }
  };
  // --- Edit Modal ---
  function openEditModal(id) {
    const course = courses.find(c => c.id == id);
    if (!course) return;
    const modalRoot = document.getElementById('modal-root');
    modalRoot.innerHTML = `
      <div class="modal-backdrop" tabindex="-1" aria-modal="true" role="dialog">
        <div class="modal" role="document">
          <button class="close-modal" aria-label="Close">&times;</button>
          <h2>Edit Course</h2>
          <form id="edit-course-form">
            <div class="form-group">
              <label for="edit-name">Course Name *</label>
              <input type="text" id="edit-name" name="name" required maxlength="80" value="${escapeHTML(course.name)}">
            </div>
            <div class="form-group">
              <label for="edit-description">Description *</label>
              <textarea id="edit-description" name="description" required maxlength="300" rows="2">${escapeHTML(course.description)}</textarea>
            </div>
            <div class="form-group">
              <label for="edit-date">Target Date *</label>
              <input type="date" id="edit-date" name="target_date" required value="${escapeHTML(course.target_date)}">
            </div>
            <div class="form-group">
              <label for="edit-status">Status *</label>
              <select id="edit-status" name="status" required>
                <option value="NOT_STARTED" ${course.status === 'NOT_STARTED' ? 'selected' : ''}>Not Started</option>
                <option value="IN_PROGRESS" ${course.status === 'IN_PROGRESS' ? 'selected' : ''}>In Progress</option>
                <option value="COMPLETED" ${course.status === 'COMPLETED' ? 'selected' : ''}>Completed</option>
              </select>
            </div>
            <div class="modal-actions">
              <button type="submit" class="btn btn-save">Save</button>
              <button type="button" class="btn btn-cancel">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    `;
    // Focus trap
    const modalBackdrop = modalRoot.querySelector('.modal-backdrop');
    modalBackdrop.focus();
    // Close modal
    modalRoot.querySelector('.close-modal').onclick =
    modalRoot.querySelector('.btn-cancel').onclick = closeModal;
    // Save
    modalRoot.querySelector('#edit-course-form').onsubmit = async function(e) {
      e.preventDefault();
      const form = e.target;
      const name = form.name.value.trim();
      const description = form.description.value.trim();
      const target_date = form.target_date.value;
      const status = form.status.value;
      if (!name || !description || !target_date || !status) {
        showMessage('error', 'Please fill in all required fields.');
        return;
      }
      modalRoot.querySelector('.btn-save').disabled = true;
      modalRoot.querySelector('.btn-save').textContent = 'Saving...';
      try {
        await apiUpdateCourse(id, { name, description, target_date, status });
        closeModal();
        await loadCourses();
      } finally {
        if (modalRoot.querySelector('.btn-save')) {
          modalRoot.querySelector('.btn-save').disabled = false;
          modalRoot.querySelector('.btn-save').textContent = 'Save';
        }
      }
    };
    // Close on backdrop click
    modalBackdrop.onclick = function(e) {
      if (e.target === modalBackdrop) closeModal();
    };
    // Escape key closes modal
    document.onkeydown = function(e) {
      if (e.key === 'Escape') closeModal();
    };
  }
  function closeModal() {
    document.getElementById('modal-root').innerHTML = '';
    document.onkeydown = null;
  }
  // --- Delete ---
  function handleDelete(id) {
    const course = courses.find(c => c.id == id);
    if (!course) return;
    if (confirm(`Are you sure you want to delete "${course.name}"? This cannot be undone.`)) {
      apiDeleteCourse(id).then(loadCourses);
    }
  }
  // --- Helpers ---
  function escapeHTML(str) {
    if (typeof str !== 'string') return '';
    return str.replace(/[&<>"']/g, function(m) {
      return ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m];
    });
  }
  // --- Initial Load ---
  window.onload = loadCourses;
</script>
</body>
</html>
